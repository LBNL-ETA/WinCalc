name: Build and test

on: [push, pull_request]
    
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
    
jobs:
  windows:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
        arch: [x86, x64]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
      # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C RELEASE -V
        
  mac:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
      # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C RELEASE -V
        
  linux:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [   ubuntu-24.04]
        arch: [x86_64, aarch64]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install QEMU for aarch64 emulation
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all
          
      - name: Upgrade gcc
        run:  sudo apt-get install -y gcc g++
        
      - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
      # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C RELEASE -V

  # Runs after every build passed. When the chart differs from the committed
  # doc/DependencyChart.md, the job creates a chart-only commit through the API,
  # puts a success status on it, and only then moves the branch to it, so the
  # branch tip always has a check status. No workflow runs on that commit: it
  # differs from the tested one in the chart alone.
  dependency-chart:
    name: Dependency chart
    needs: [windows, mac, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/rework/bcs'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      statuses: write
    concurrency:
      group: dependency-chart

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Show the dependency chart on the run's summary page
        run: cat doc/WinCalc.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the chart when it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if cmp -s doc/WinCalc.md doc/DependencyChart.md; then
            echo "The committed chart is current."
            exit 0
          fi
          api="repos/${GITHUB_REPOSITORY}"
          tip=$(gh api "${api}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "The branch moved past ${GITHUB_SHA}; the newer run commits the chart."
            exit 0
          fi
          base_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          blob=$(printf '{"content":"%s","encoding":"base64"}' "$(base64 -w0 doc/WinCalc.md)" \
            | gh api -X POST "${api}/git/blobs" --input - --jq '.sha')
          tree=$(printf '{"base_tree":"%s","tree":[{"path":"doc/DependencyChart.md","mode":"100644","type":"blob","sha":"%s"}]}' "$base_tree" "$blob" \
            | gh api -X POST "${api}/git/trees" --input - --jq '.sha')
          commit=$(printf '{"message":"Refresh dependency chart","tree":"%s","parents":["%s"]}' "$tree" "$GITHUB_SHA" \
            | gh api -X POST "${api}/git/commits" --input - --jq '.sha')
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '{"state":"success","context":"Builds carried over","description":"Chart-only commit; all builds passed on %s","target_url":"%s"}' "${GITHUB_SHA:0:7}" "$run_url" \
            | gh api -X POST "${api}/statuses/${commit}" --input - --jq '.state'
          printf '{"sha":"%s","force":false}' "$commit" \
            | gh api -X PATCH "${api}/git/refs/heads/${GITHUB_REF_NAME}" --input - --jq '.object.sha'
